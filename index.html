<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Operaciones - EJESA</title>
    
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Carga de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!-- Fondo azul oscuro con degradado radial y texto claro -->
<body class="bg-slate-900 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(30,58,138,0.7),rgba(15,23,42,1))] min-h-screen p-4 md:p-8 font-sans text-slate-200 selection:bg-cyan-500 selection:text-white">

    <!-- Encabezado Moderno -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-blue-800/50 pb-5">
        <div class="text-3xl md:text-4xl font-extrabold tracking-widest text-center md:text-left drop-shadow-lg">
            <!-- Texto EJESA con degradado brillante -->
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500">EJESA</span> 
            <span class="text-gray-400 font-light">|</span> 
            <span class="text-gray-100">SISTEMA DE OPERACIONES</span>
        </div>
    </div>

    <!-- Pestañas de Selección de Parque (Estilo Glassmorphism) -->
    <div class="flex flex-wrap justify-center gap-3 md:gap-5 mb-10">
        <button id="btn-sectorA" onclick="mostrarSector('sectorA')" class="tab-btn px-6 py-2.5 font-bold text-sm md:text-base rounded-full transition-all duration-300 border backdrop-blur-md">
            CAUCHARI 1 (A)
        </button>
        <button id="btn-sectorB" onclick="mostrarSector('sectorB')" class="tab-btn px-6 py-2.5 font-bold text-sm md:text-base rounded-full transition-all duration-300 border backdrop-blur-md">
            CAUCHARI 2 (B)
        </button>
        <button id="btn-sectorC" onclick="mostrarSector('sectorC')" class="tab-btn px-6 py-2.5 font-bold text-sm md:text-base rounded-full transition-all duration-300 border backdrop-blur-md">
            CAUCHARI 3 (C)
        </button>
    </div>

    <!-- Contenedor del Mapa Activo -->
    <div class="flex justify-center mb-12 overflow-x-auto pb-6">
        <!-- Sector A (Activo por defecto) -->
        <div id="sectorA" class="grid grid-cols-9 gap-2 md:gap-3 w-fit"></div>
        
        <!-- Sector B (Oculto por defecto) -->
        <div id="sectorB" class="grid grid-cols-8 gap-2 md:gap-3 w-fit hidden"></div>
        
        <!-- Sector C (Oculto por defecto) -->
        <div id="sectorC" class="grid grid-cols-11 gap-2 md:gap-3 w-fit hidden"></div>
    </div>

    <!-- Seccionadores Inferiores -->
    <div class="border-t border-blue-900/50 pt-8 mt-4">
        <div class="text-center text-cyan-500/80 tracking-[0.2em] font-bold text-xs md:text-sm mb-6 uppercase drop-shadow-md">
            Seccionadores Principales
        </div>
        <div id="seccionadores" class="flex flex-wrap justify-center gap-3 md:gap-4"></div>
    </div>

    <!-- Script de lógica y mapeo -->
    <script>
        // --- CONFIGURACIÓN DE ESTILOS MODERNOS (Tailwind Classes) ---
        
        // Clases base para TODOS los botones de equipos (tamaño, sombras, animaciones)
        const claseBaseBoton = "w-11 h-11 md:w-14 md:h-14 rounded-xl flex items-center justify-center font-extrabold text-xs md:text-sm border border-opacity-60 cursor-pointer transition-all duration-300 transform hover:scale-110 hover:-translate-y-1 hover:z-10";
        
        // Diccionario de colores con degradados, brillos (glow) y opacidades
        const estilosEstados = {
            'blanco': 'bg-gradient-to-br from-slate-200 to-slate-400 text-slate-900 border-slate-300 shadow-lg',
            'verde': 'bg-gradient-to-br from-green-400 to-emerald-600 text-white border-green-300 shadow-[0_0_15px_rgba(52,211,153,0.6)]',
            'amarillo': 'bg-gradient-to-br from-yellow-300 to-amber-500 text-slate-900 border-yellow-200 shadow-[0_0_15px_rgba(252,211,77,0.6)]',
            'negro': 'bg-gradient-to-br from-slate-700 to-slate-900 text-white border-slate-600 shadow-lg',
            'rojo': 'bg-gradient-to-br from-red-500 to-rose-700 text-white border-red-400 shadow-[0_0_20px_rgba(244,63,94,0.8)]', // Glow más fuerte
            'azul': 'bg-gradient-to-br from-blue-400 to-indigo-600 text-white border-blue-300 shadow-[0_0_15px_rgba(96,165,250,0.6)]'
        };

        // Clases para las pestañas
        const tabActiva = ['bg-gradient-to-r', 'from-cyan-500', 'to-blue-600', 'text-white', 'border-cyan-400', 'shadow-[0_0_15px_rgba(6,182,212,0.5)]', 'scale-105'];
        const tabInactiva = ['bg-white/10', 'text-gray-400', 'border-white/10', 'hover:bg-white/20', 'hover:text-white'];

        // --- LÓGICA DE INTERFAZ ---

        function mostrarSector(sectorId) {
            // Ocultar todos
            document.getElementById('sectorA').classList.add('hidden');
            document.getElementById('sectorB').classList.add('hidden');
            document.getElementById('sectorC').classList.add('hidden');
            
            // Mostrar seleccionado
            document.getElementById(sectorId).classList.remove('hidden');

            // Resetear botones a inactivos
            const botones = ['btn-sectorA', 'btn-sectorB', 'btn-sectorC'];
            botones.forEach(btnId => {
                const btn = document.getElementById(btnId);
                btn.classList.remove(...tabActiva);
                btn.classList.add(...tabInactiva);
            });

            // Activar botón seleccionado
            const btnActivo = document.getElementById('btn-' + sectorId);
            btnActivo.classList.remove(...tabInactiva);
            btnActivo.classList.add(...tabActiva);
        }

        // Mapas Exactos (Siluetas)
        const mapaA = [
            null, null, null, null, null, null, null, 'A01', null,
            'A02', 'A03', 'A04', 'A05', 'A06', 'A07', 'A08', 'A09', null,
            null, 'A10', 'A11', 'A12', 'A13', 'A14', 'A15', 'A16', 'A17',
            null, null, 'A18', 'A19', 'A20', 'A21', 'A22', 'A23', 'A24',
            null, null, null, 'A25', 'A26', 'A27', 'A28', 'A29', 'A30',
            null, null, null, null, 'A31', 'A32', 'A33', 'A34', 'A35'
        ];

        const mapaB = [
            null, null, 'B01', 'B02', 'B03', 'B04', 'B05', null,
            null, 'B06', 'B07', 'B08', 'B09', 'B10', 'B11', 'B12',
            'B13', 'B14', 'B15', 'B16', 'B17', 'B18', 'B19', 'B20',
            'B21', 'B22', 'B23', 'B24', 'B25', 'B26', 'B27', 'B28',
            'B29', 'B30', 'B31', 'B32', 'B33', 'B34', 'B35', null
        ];

        const mapaC = [
            'C01', 'C02', 'C03', 'C04', 'C05', 'C06', null, null, null, null, null,
            'C07', 'C08', 'C09', 'C10', 'C11', 'C12', null, null, null, null, null,
            'C13', 'C14', 'C15', 'C16', 'C17', 'C18', 'C19', null, null, null, null,
            null, 'C20', 'C21', 'C22', 'C23', 'C24', null, null, null, null, null,
            null, null, null, null, null, null, null, null, null, 'C25', 'C26',
            null, null, null, null, null, null, 'C27', 'C28', 'C29', 'C30', 'C31',
            null, null, null, null, null, null, null, 'C32', 'C33', 'C34', 'C35'
        ];

        const seccionadores = ['DA1a', 'DA1b', 'DA2', 'DA3', 'DB1', 'DB2', 'DB3', 'DC1', 'DC2', 'DC3'];

        // Estado simulado (Base de Datos)
        const estadoEquipos = {
            'B34': 'rojo',
            'A05': 'verde',
            'C12': 'azul',
            'A10': 'negro',
            'B02': 'amarillo'
        };

        function renderizarMapa(mapa, contenedorId) {
            const contenedor = document.getElementById(contenedorId);
            
            mapa.forEach(equipo => {
                if (equipo === null) {
                    // Div transparente para mantener la forma (misma medida que el botón)
                    const espacioVacio = document.createElement('div');
                    espacioVacio.className = 'w-11 h-11 md:w-14 md:h-14'; 
                    contenedor.appendChild(espacioVacio);
                } else {
                    const btn = document.createElement('button');
                    // Busca el color en estadoEquipos, si no existe usa 'blanco'
                    const colorClave = estadoEquipos[equipo] || 'blanco';
                    const clasesColor = estilosEstados[colorClave];
                    
                    // Unimos las clases base con las de color
                    btn.className = `${claseBaseBoton} ${clasesColor}`;
                    btn.innerText = equipo;
                    
                    btn.ondblclick = () => {
                        alert('Abriendo sistema para: ' + equipo);
                    };

                    contenedor.appendChild(btn);
                }
            });
        }

        // Inicialización
        renderizarMapa(mapaA, 'sectorA');
        renderizarMapa(mapaB, 'sectorB');
        renderizarMapa(mapaC, 'sectorC');
        renderizarMapa(seccionadores, 'seccionadores');
        
        // Activar Pestaña A por defecto
        mostrarSector('sectorA');
    </script>
</body>
</html>
