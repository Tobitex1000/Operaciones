<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Operaciones - EJESA</title>
    
    <!-- Carga de Tailwind CSS sin instalar nada -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Carga de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Clases de colores dinámicos */
        .estado-blanco { background-color: #ffffff; color: #000000; border-color: #d1d5db; }
        .estado-verde { background-color: #22c55e; color: #ffffff; border-color: #15803d; }
        .estado-amarillo { background-color: #facc15; color: #000000; border-color: #ca8a04; }
        .estado-negro { background-color: #000000; color: #ffffff; border-color: #6b7280; }
        .estado-rojo { background-color: #dc2626; color: #ffffff; border-color: #991b1b; }
        .estado-azul { background-color: #2563eb; color: #ffffff; border-color: #1e40af; }
    </style>
</head>
<body class="bg-neutral-800 min-h-screen p-8 font-sans">

    <!-- Encabezado -->
    <div class="flex justify-between items-center mb-8 border-b-2 border-blue-900 pb-4">
        <div class="text-white text-3xl font-bold tracking-wider">
            <span class="text-cyan-400">EJESA</span> | SISTEMA DE OPERACIONES
        </div>
    </div>

    <!-- Contenedor del Mapa -->
    <div class="flex flex-col gap-10">
        <div class="flex flex-wrap justify-between gap-8">
            <!-- Sector A -->
            <div id="sectorA" class="grid grid-cols-6 gap-1 w-fit"></div>
            <!-- Sector B -->
            <div id="sectorB" class="grid grid-cols-6 gap-1 w-fit"></div>
            <!-- Sector C -->
            <div id="sectorC" class="grid grid-cols-6 gap-1 w-fit"></div>
        </div>

        <!-- Seccionadores Inferiores -->
        <div id="seccionadores" class="flex justify-center gap-4 mt-8"></div>
    </div>

    <!-- Script de lógica pura (Vanilla JS) -->
    <script>
        // Función para generar los nombres de los bloques (Ej: A01 a A35)
        function generarBloques(letra, inicio, fin) {
            let bloques = [];
            for (let i = inicio; i <= fin; i++) {
                let numero = i < 10 ? '0' + i : i;
                bloques.push(letra + numero);
            }
            return bloques;
        }

        const sectorA = generarBloques('A', 1, 35);
        const sectorB = generarBloques('B', 1, 35);
        const sectorC = generarBloques('C', 1, 35);
        const seccionadores = ['DA1a', 'DA1b', 'DA2', 'DA3', 'DB1', 'DB2', 'DB3', 'DC1', 'DC2', 'DC3'];

        // Simulación de datos que luego vendrán de Supabase
        const estadoEquipos = {
            'B34': 'estado-rojo',
            'A05': 'estado-verde',
            'C12': 'estado-azul',
            'A10': 'estado-negro',
            'B02': 'estado-amarillo'
        };

        // Función para crear cada botón del mapa
        function renderizarSector(listaEquipos, contenedorId) {
            const contenedor = document.getElementById(contenedorId);
            
            listaEquipos.forEach(equipo => {
                const btn = document.createElement('button');
                // Si el equipo tiene un estado en la BD, lo usa; si no, queda blanco
                const claseEstado = estadoEquipos[equipo] || 'estado-blanco';
                
                btn.className = `w-12 h-10 flex items-center justify-center font-bold text-sm border-2 cursor-pointer transition-all hover:opacity-80 shadow-sm ${claseEstado}`;
                btn.innerText = equipo;
                
                // Evento de doble clic
                btn.ondblclick = () => {
                    alert('Abriendo ventana de carga para: ' + equipo);
                    // Aquí llamaremos a la ventana flotante
                };

                contenedor.appendChild(btn);
            });
        }

        // Ejecutar el renderizado al cargar la página
        renderizarSector(sectorA, 'sectorA');
        renderizarSector(sectorB, 'sectorB');
        renderizarSector(sectorC, 'sectorC');
        renderizarSector(seccionadores, 'seccionadores');
    </script>
</body>
</html>
